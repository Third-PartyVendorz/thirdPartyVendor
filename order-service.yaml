openapi: 3.0.3
info:
  title: Order Service API
  description: API for managing orders
  version: 1.0.0

paths: 
  /orders:
    get:
      summary: Get all orders
      operationId: getOrders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of orders was returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersRequest'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new order
      operationId: createOrder
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrder'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{orderId}:
    get:
      summary: Get an order by ID
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRequest'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  patch:
    summary: Update an order by ID
    operationId: updateOrderById
    security:
        - bearerAuth: []
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateOrder'
    responses:
      '201':
        description: Order updated successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrder'
      '400':
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: Unauthorized 
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Order not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: Unprocessable Entity
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

components: 
  schemas:
    CreateOrder:
      type: object
      properties:
        ticker:
          type: string
        orderIntent:
          type: string
        quantity:
          type: number
          format: float
        price:
          type: number
          format: float
        currency:
          type: string
      required: [ticker, orderIntent, currency]
    OrderRequest:
      type: object
      properties:
        ticker:
          type: string
        orderIntent:
          type: string
        quantity:
          type: number
          format: float
        price:
          type: number
          format: float
        currency:
          type: string
      required: [id, product, quantity, price]
    OrdersRequest:
      type: array
      items:
        $ref: '#/components/schemas/OrderRequest'
    UpdateOrder:
      type: object
      properties:
        ticker:
          type: string
        orderIntent:
          type: string
        quantity:
          type: number
          format: float
        price:
          type: number
          format: float
        currency:
          type: string
      required: [ticker, orderIntent, currency]
    
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT