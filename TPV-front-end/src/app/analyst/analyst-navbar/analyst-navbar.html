<div class="navbar-content">
  <div class="brand-name">
    <h1>Third Party Vendor</h1>
  </div>
  <div class="role-actions">
    @if (accountIsFrozen) {
      <span class="frozen-warning" role="status" tabindex="0" aria-label="Account frozen">
        <span class="material-icons-outlined" aria-hidden="true">error_outline</span>
        <span class="frozen-warning__tooltip" role="tooltip">Your account is frozen</span>
      </span>
    }
    <button class="logout-button" type="button" (click)="logout()">Logout</button>
  </div>
</div>
