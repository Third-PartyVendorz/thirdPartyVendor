<div class="navbar-content">
    <div class="brand-name">
        <h1>Third Party Vendor</h1>
    </div>
    <nav class="desktop-nav">
        <ul>
            <li routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"><a class="nav-link" routerLink="/dashboard">Portfolio</a></li>
            <li routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"><a class="nav-link" routerLink="/portfolio-history">Portfolio History</a></li>
            <li routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"><a class="nav-link" routerLink="/trade">Execute Trade</a></li>
            <li routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"><a class="nav-link" routerLink="/explore-assets">Explore Assets</a></li>
            <li routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"><a class="nav-link" routerLink="/profile">Profile</a></li>
        </ul>
    </nav>

    <a class="profile-button" routerLink="/profile" aria-label="Open profile page">
        <img src="/profile-icon.jpg" alt="Profile Icon">
    </a>

    <button class="mobile-menu-button" (click)="isMenuOpen = !isMenuOpen">
        ☰
    </button>
</div>

<div class="mobile-nav" *ngIf="isMenuOpen" (click)="$event.stopPropagation()">
    <a class="nav-link" routerLink="/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Portfolio</a>
    <a class="nav-link" routerLink="/portfolio-history" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Portfolio History</a>
    <a class="nav-link" routerLink="/trade" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Execute Trade</a>
    <a class="nav-link" routerLink="/explore-assets" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Explore Assets</a>
    <a class="nav-link" routerLink="/profile" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Profile</a>
</div>
