<div class="holdings-card">
    <div class="card-header">
        <h2>Holdings</h2>
        <label for="mobile-sort" class="mobile-sort-label">Sort by:</label>
        <select #sortSelect id="mobile-sort" class="mobile-sort-dropdown" (change)="onSortChange(sortSelect.value)">
            <option value="">Default Order</option>
            <option value="ticker">Ticker</option>
            <option value="shares">Shares</option>
        </select>
    </div>

    <!-- Desktop Table View -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th class="sortable">
                        <button class="sort-trigger" type="button" (click)="toggleSort('ticker')" [attr.aria-label]="'Sort holdings by ticker'">
                            Ticker
                            <span class="sort-indicator" [class.sort-indicator--asc]="getSortState('ticker') === 'asc'" [class.sort-indicator--desc]="getSortState('ticker') === 'desc'" aria-hidden="true"><span></span><span></span></span>
                        </button>
                    </th>
                    <th>Security</th>
                    <th>Type</th>
                    <th class="numeric sortable">
                        <button class="sort-trigger" type="button" (click)="toggleSort('shares')" [attr.aria-label]="'Sort holdings by shares'">
                            Shares
                            <span class="sort-indicator" [class.sort-indicator--asc]="getSortState('shares') === 'asc'" [class.sort-indicator--desc]="getSortState('shares') === 'desc'" aria-hidden="true"><span></span><span></span></span>
                        </button>
                    </th>
                    <!-- <th class="numeric sortable" (click)="toggleSort('averageCost')">
                        Avg. Cost {{ getSortIndicator('averageCost') }}
                    </th>
                    <th class="numeric sortable" (click)="toggleSort('lastPrice')">
                        Last Price {{ getSortIndicator('lastPrice') }}
                    </th>
                    <th class="numeric sortable" (click)="toggleSort('marketValue')">
                        Market Value {{ getSortIndicator('marketValue') }}
                    </th>
                    <th class="numeric sortable" (click)="toggleSort('gainLoss')">
                        Total Gain/Loss {{ getSortIndicator('gainLoss') }}
                    </th>
                    <th class="numeric sortable" (click)="toggleSort('dailyChangePercent')">
                        Day Change {{ getSortIndicator('dailyChangePercent') }}
                    </th> -->
                </tr>
            </thead>
            <tbody>
                    <tr *ngFor="let holding of displayedHoldings">
                        <td data-label="Ticker"><a class="holding-ticker" [routerLink]="['/explore-assets']" [queryParams]="{ ticker: holding.ticker }">{{ holding.ticker }}</a></td>
                    <td data-label="Security">{{ holding.security }}</td>
                    <td data-label="Type">{{ holding.assetType }}</td>
                    <td class="numeric" data-label="Shares">{{ holding.numShares }}</td>
                    <!-- <td data-label="Name">{{ holding.companyName }}</td>
                    
                    <td class="numeric" data-label="Avg. Cost">{{ holding.averageCost | currency }}</td>
                    <td class="numeric" data-label="Last Price">{{ holding.lastPrice | currency }}</td>
                    <td class="numeric" data-label="Market Value">{{ holding.marketValue | currency }}</td>
                    <td class="numeric change" data-label="Total Gain/Loss" [class.positive]="holding.gainLoss > 0" [class.negative]="holding.gainLoss < 0">
                        <div>{{ holding.gainLoss > 0 ? '+' : '' }}{{ holding.gainLoss | currency }}</div>
                        <small>({{holding.gainLossPercent > 0 ? '+' : ''}}{{ holding.gainLossPercent | number:'1.2-2' }}%)</small>
                    </td>
                    <td class="numeric" data-label="Day Change" [class.positive]="holding.dailyChangePercent > 0" [class.negative]="holding.dailyChangePercent < 0">
                        {{ holding.dailyChangePercent > 0 ? '▲' : '▼' }} {{ holding.dailyChangePercent }}%
                    </td> -->
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Mobile Card View -->
    <div class="mobile-holdings">
        <div class="mobile-holdings-item" *ngFor="let holding of holdings" [class.expanded]="isExpanded(holding.ticker)">
            <div class="mobile-holdings-header">
                <button (click)="toggleExpand(holding.ticker)" class="expand-button">
                    <span class="expand-icon">{{ isExpanded(holding.ticker) ? '▼' : '▶' }}</span>
                    <!-- {{ holding.companyName }}  -->
                    (<a class="holding-ticker" [routerLink]="['/explore-assets']" [queryParams]="{ ticker: holding.ticker }">{{ holding.ticker }}</a>)
                </button>
            </div>
            <div class="mobile-summary-card" *ngIf="isExpanded(holding.ticker)">
                <div class="mobile-holdings-row">
                    <span class="mobile-holdings-label">Ticker</span>
                    <span class="mobile-holdings-value company-name">{{ holding.ticker }}</span>
                </div>
                <div class="mobile-holdings-row">
                    <span class="mobile-holdings-label">Security</span>
                    <span class="mobile-holdings-value company-name">{{ holding.security }}</span>
                </div>
                <div class="mobile-holdings-row">
                    <span class="mobile-holdings-label">Type</span>
                    <span class="mobile-holdings-value">{{ holding.assetType }}</span>
                </div>
                <div class="mobile-holdings-row">
                    <span class="mobile-holdings-label">Shares</span>
                    <span class="mobile-holdings-value">{{ holding.numShares }}</span>
                </div>
                <!-- <div class="mobile-holdings-row">
                    <span class="mobile-holdings-label">Name</span>
                    <span class="mobile-holdings-value company-name">{{ holding.companyName }}</span>
                </div>
                <div class="mobile-holdings-row">
                    <span class="mobile-holdings-label">Avg. Cost</span>
                    <span class="mobile-holdings-value">{{ holding.averageCost | currency }}</span>
                </div>
                <div class="mobile-holdings-row">
                    <span class="mobile-holdings-label">Last Price</span>
                    <span class="mobile-holdings-value">{{ holding.lastPrice | currency }}</span>
                </div>
                <div class="mobile-holdings-row">
                    <span class="mobile-holdings-label">Market Value</span>
                    <span class="mobile-holdings-value">{{ holding.marketValue | currency }}</span>
                </div>
                <div class="mobile-holdings-row">
                    <span class="mobile-holdings-label">Total Gain/Loss</span>
                    <span class="mobile-holdings-value" [class.positive]="holding.gainLoss > 0" [class.negative]="holding.gainLoss < 0">
                        {{ holding.gainLoss > 0 ? '+' : '' }}{{ holding.gainLoss | currency }}<br/>
                        <small>({{holding.gainLossPercent > 0 ? '+' : ''}}{{ holding.gainLossPercent | number:'1.2-2' }}%)</small>
                    </span>
                </div>
                <div class="mobile-holdings-row">
                    <span class="mobile-holdings-label">Day Change</span>
                    <span class="mobile-holdings-value" [class.positive]="holding.dailyChangePercent > 0" [class.negative]="holding.dailyChangePercent < 0">
                        {{ holding.dailyChangePercent > 0 ? '▲' : '▼' }} {{ holding.dailyChangePercent }}%
                    </span>
                </div> -->
            </div>
        </div>
    </div>

    <div class="table-footer">
        <button 
            *ngIf="hasMoreHoldings" 
            class="load-more-btn"
            (click)="loadMore()"
        >
            Load More
        </button>
    </div>
</div>
