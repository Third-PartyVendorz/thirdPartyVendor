<div class="dashboard">
    <app-page-header eyebrow="Portfolio" title="Your portfolio">
        <button class="button-primary" routerLink="/trade">Execute trade <span aria-hidden="true">↗</span></button>
    </app-page-header>
    <div class="top-row">
        <app-portfolio-summary
            [holdings]="holdings"
            [holdingsLoading]="isLoading"
            [holdingsError]="errorMessage"/>
    </div>
    <app-forex-holdings/>
    <app-holdings-table [holdings]="holdings"/>
    <app-portfolio-graphics
    [holdings]="holdings"
    [holdingsLoading]="isLoading"
    [holdingsError]="errorMessage"/>
</div>
