<header class="navbar-content">
  <div class="brand-name">
    <h1>Third Party Vendor</h1>
    <span>Administration</span>
  </div>
  <nav aria-label="Administration navigation">
    <a routerLink="/admin/users" routerLinkActive="active-link">Manage Users</a>
  </nav>
  <div class="profile-menu">
    <button class="profile-button" type="button" (click)="toggleProfileMenu($event)" [attr.aria-expanded]="isProfileMenuOpen" aria-haspopup="menu">
      <img src="/profile-icon.jpg" alt="Admin profile">
    </button>
    <div class="profile-dropdown" *ngIf="isProfileMenuOpen" role="menu">
      <span role="menuitem">Administrator</span>
      <button type="button" role="menuitem" (click)="logout()">Logout</button>
    </div>
  </div>
</header>
