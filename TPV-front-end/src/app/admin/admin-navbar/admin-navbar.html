<div class="navbar-content">
  <div class="brand-name">
    <h1>Third Party Vendor</h1>
  </div>
  <nav class="desktop-nav">
    <ul>
      <li routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"><a class="nav-link" routerLink="/admin">Dashboard</a></li>
      <li routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"><a class="nav-link" routerLink="/admin/users">Manage Users</a></li>
      <li routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"><a class="nav-link" routerLink="/admin/audit">Audit Logs</a></li>
    </ul>
  </nav>
  <div class="role-actions">
    @if (accountIsFrozen) {
      <span class="frozen-warning" role="status" tabindex="0" aria-label="Account frozen">
        <span class="material-icons-outlined" aria-hidden="true">error_outline</span>
        <span class="frozen-warning__tooltip" role="tooltip">Your account is frozen</span>
      </span>
    }
    <button class="logout-button" type="button" (click)="logout()">Logout</button>
  </div>
  <button class="mobile-menu-button" (click)="isMenuOpen = !isMenuOpen">
    ☰
  </button>
</div>

<div class="mobile-nav" *ngIf="isMenuOpen" (click)="$event.stopPropagation()">
  <a class="nav-link" routerLink="/admin" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
  <a class="nav-link" routerLink="/admin/users" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Manage Users</a>
  <a class="nav-link" routerLink="/admin/audit" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }">Audit Logs</a>
  @if (accountIsFrozen) {
    <span class="frozen-warning frozen-warning--mobile" role="status" tabindex="0" aria-label="Account frozen">
      <span class="material-icons-outlined" aria-hidden="true">error_outline</span>
      <span class="frozen-warning__tooltip" role="tooltip">Your account is frozen</span>
    </span>
  }
  <button class="nav-link" type="button" (click)="logout()">Logout</button>
</div>
