<nav class="navbar">Third Party Vendors</nav>
<div class="registration-page"> 
  <div class="login-container">
    <div class="left-column">
      <h1>Trading Made Easy</h1>
      <p>Buy and sell, sive live market updates, histories, and more</p>
    </div>
    <div class="right-column">
      <h2>Register</h2>
    <form (ngSubmit)="onRegister($event)" class="login-card">
      <div class="form-group">
        <label for="first-name">First Name</label>
        <input type="text" id="first-name" name="firstName" required autocomplete="given-name">
      </div>
      <div class="form-group">
        <label for="last-name">Last Name</label>
        <input type="text" id="last-name" name="lastName" required autocomplete="family-name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-group">
        <label for="phone-number">Phone Number</label>
        <input type="tel" id="phone-number" name="phone-number" required>
      </div>
      <div class="form-group">
        <label for="date-of-birth">Date of Birth</label>
        <input type="date" id="dob" name="date-of-birth" required>
      </div>
      <button type="submit" class="register-button">Register</button>
    </form>
    </div>
  </div>
</div>
